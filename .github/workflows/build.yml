      - name: Write the build settings (buildozer.spec)
        run: |
          cat > buildozer.spec <<'SPEC'
          [app]
          title = Flappy Dragon
          package.name = flappydragon
          package.domain = org.dragon
          source.dir = .
          source.include_exts = py
          source.exclude_dirs = .github, bin, .buildozer, out
          version = 0.2.0
          requirements = hostpython3==3.10.14,python3==3.10.14,pygame,pyjnius
          orientation = landscape
          fullscreen = 1
          android.permissions = VIBRATE
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True
          android.allow_backup = True
          p4a.branch = develop

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          # the icon and loading screen are used only if they were uploaded
          if [ -f icon.png ]; then sed -i "/^\[buildozer\]/i icon.filename = %(source.dir)s/icon.png" buildozer.spec; fi
          if [ -f presplash.jpg ]; then sed -i "/^\[buildozer\]/i presplash.filename = %(source.dir)s/presplash.jpg\nandroid.presplash_color = #0B0A14" buildozer.spec; fi
          sed -i "s/^version = .*/version = 0.3.${{ github.run_number }}/" buildozer.spec
          echo 'BUILD = "beta 0.3.${{ github.run_number }}"' > fd_build.py
          ls *.py | wc -l
          cat buildozer.spec

      - name: Write the start-up files and check every game file is here
        run: |
          [ -f main.py ] || printf 'import flappy_dragon\nflappy_dragon.main()\n' > main.py
          if [ ! -f flappy_dragon.py ]; then
          cat > flappy_dragon.py <<'START'
          """
          Flappy Dragon: Siege Master  --  run THIS file.
          Keep fd_core.py, fd_art.py, fd_logic.py and fd_draw.py in the same folder.
          """
          import pygame
          import os
          import sys
          try:
            sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          except NameError:
            sys.path.insert(0, os.getcwd())
          pygame.mixer.pre_init(22050, -16, 1, 512)
          pygame.init()
          from fd_core import *
          from fd_art import *
          from fd_logic import GameLogic
          from fd_draw import GameDraw

          class Game(GameLogic, GameDraw):
            pass

          def main():
            Game().run()

          if __name__ == "__main__":
            main()

          START
          fi
          missing=""
          for f in \
            fd_alien.py fd_art.py fd_baby.py fd_babyart.py fd_beholder.py fd_bestart.py \
            fd_bone.py fd_boss.py fd_clockwork.py fd_cockatrice.py fd_core.py fd_cosmic.py \
            fd_cyclops.py fd_death.py fd_draw.py fd_eagle.py fd_eggart.py fd_eggs.py \
            fd_enemy_anims.py fd_env.py fd_extra.py fd_fey.py fd_foes.py fd_folk.py \
            fd_forest.py fd_forest_dragon.py fd_forgeart.py fd_hd.py fd_hearthart.py fd_hydra.py \
            fd_ice.py fd_infoart.py fd_items.py fd_jabber.py fd_lairart.py fd_lightning.py \
            fd_logic.py fd_lung.py fd_mages.py fd_magma.py fd_menuart.py fd_music.py \
            fd_night.py fd_optart.py fd_phoenix.py fd_pixart.py fd_poison.py fd_questart.py \
            fd_reportart.py fd_satyr.py fd_sheet.py fd_siege.py fd_sound.py fd_stableart.py \
            fd_towers.py fd_ui.py fd_unicorn.py fd_villagers.py fd_whale.py fd_wind.py \
            fd_witch.py fd_wraith.py \
            fd_font.py fd_extras.py fd_levelart.py fd_world_desert.py fd_skyart.py fd_world_swamp.py fd_world_frozen.py fd_world_volcano.py fd_world_skyisle.py fd_world_void.py fd_spider.py fd_modes.py fd_ground.py fd_tracks.py fd_raven.py fd_peryton.py fd_newfoes.py fd_foes2.py fd_boss2.py fd_perks.py fd_achieve.py fd_isles.py fd_goart.py fd_ultfx.py; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "These game files are MISSING - upload them to the repository:"
            for f in $missing; do echo "   $f"; done
            exit 1
          fi
          echo "All game files are here."

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Rename the APK
        run: |
          mkdir -p out
          cp bin/*.apk "out/FlappyDragon-beta-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: FlappyDragon-beta-${{ github.run_number }}
          path: out/*.apk

      - name: Publish it as a downloadable beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Flappy Dragon beta ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: |
            Beta build ${{ github.run_number }} of Flappy Dragon.
            Download the .apk below on your Android phone and open it to install.
