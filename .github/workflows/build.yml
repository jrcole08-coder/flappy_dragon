name: Build beta APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Reuse the Android tools from the last build (much faster)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Use the same signing key every time (so friends can update without losing their save)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Give this build its own version number
        run: sed -i "s/^version = .*/version = 0.2.${{ github.run_number }}/" buildozer.spec

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Rename the APK
        run: |
          mkdir -p out
          cp bin/*.apk "out/FlappyDragon-beta-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: FlappyDragon-beta-${{ github.run_number }}
          path: out/*.apk

      - name: Publish it as a downloadable beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Flappy Dragon beta ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: |
            Beta build ${{ github.run_number }} of Flappy Dragon.
            Download the .apk below on your Android phone and open it to install.
